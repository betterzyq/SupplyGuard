[project]
name = "supplyguard"
version = "0.1.0"
description = "Supply chain risk management Agent Harness platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.0",
    "deepeval>=4.0.6",
    "email-validator>=2.0.0",
    "fastapi>=0.138.0",
    "greenlet>=3.0.0",
    "httpx>=0.28.1",
    "langchain>=1.3.10",
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.6",
    "loguru>=0.7.3",
    "minio>=7.2.20",
    "neo4j>=6.2.0",
    "openai>=2.43.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.13.3",
    "python-docx>=1.2.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ipykernel>=7.3.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.18",
]

[tool.ruff.lint.per-file-ignores]
"packages/common/db/models/*.py" = ["F821"]
