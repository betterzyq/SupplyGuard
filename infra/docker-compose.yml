services:
  postgres:
    image: postgres:16
    container_name: supplyguard-postgres
    environment:
      POSTGRES_USER: supplyguard
      POSTGRES_PASSWORD: supplyguard
      POSTGRES_DB: supplyguard
    ports:
      - "5432:5432"
    volumes:
      - supplyguard_postgres_data:/var/lib/postgresql/data
    networks:
      - supplyguard-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplyguard -d supplyguard"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: supplyguard-redis
    ports:
      - "6379:6379"
    volumes:
      - supplyguard_redis_data:/data
    networks:
      - supplyguard-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: supplyguard-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - supplyguard_qdrant_data:/qdrant/storage
    networks:
      - supplyguard-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5
    container_name: supplyguard-neo4j
    environment:
      NEO4J_AUTH: neo4j/supplyguard
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - supplyguard_neo4j_data:/data
      - supplyguard_neo4j_logs:/logs
    networks:
      - supplyguard-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: supplyguard-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: supplyguard
      MINIO_ROOT_PASSWORD: supplyguard123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - supplyguard_minio_data:/data
    networks:
      - supplyguard-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  supplyguard_postgres_data:
  supplyguard_redis_data:
  supplyguard_qdrant_data:
  supplyguard_neo4j_data:
  supplyguard_neo4j_logs:
  supplyguard_minio_data:

networks:
  supplyguard-net:
    driver: bridge
